name: Deploy Vercel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set app version
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:write
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-vercel-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set app version
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:write
      - name: Deploy Vercel Preview
        if: github.event_name == 'workflow_dispatch'
        id: deploy-preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          PREVIEW_URL="$(npx --yes vercel@60.1.3 --target preview --yes)"
          if [[ ! "$PREVIEW_URL" =~ ^https:// ]]; then
            printf '%s\n' 'Vercel CLI did not return a Preview URL.' >&2
            exit 1
          fi
          printf 'url=%s\n' "$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          printf 'Preview URL: %s\n' "$PREVIEW_URL"
      - name: Smoke-test password-protected note with vercel curl
        if: github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_PREVIEW_URL: ${{ steps.deploy-preview.outputs.url }}
        run: node scripts/smoke-vercel-preview.mjs
      - name: Deploy Vercel Production
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@60.1.3 --prod --yes
