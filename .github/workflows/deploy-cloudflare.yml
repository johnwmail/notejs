name: Deploy Cloudflare

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set app version
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:write
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set app version
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:write
      - name: Set KV namespace ID
        env:
          CLOUDFLARE_KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
        run: |
          if [[ ! "$CLOUDFLARE_KV_ID" =~ ^[[:xdigit:]]{32}$ ]]; then
            printf '%s\n' 'CLOUDFLARE_KV_ID must be a 32-character hexadecimal namespace ID.' >&2
            exit 1
          fi
          sed -i "s/^id = \"local-dev\"$/id = \"$CLOUDFLARE_KV_ID\"/" wrangler.toml
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
