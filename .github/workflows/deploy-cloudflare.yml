name: Deploy Cloudflare

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set app version
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:write
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cloudflare-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set app version
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:write
      - name: Set production KV namespace ID
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
        run: |
          if [[ ! "$CLOUDFLARE_KV_ID" =~ ^[[:xdigit:]]{32}$ ]]; then
            printf '%s\n' 'CLOUDFLARE_KV_ID must be a 32-character hexadecimal namespace ID.' >&2
            exit 1
          fi
          sed -i "s/^id = \"local-dev\"$/id = \"$CLOUDFLARE_KV_ID\"/" wrangler.toml
      - name: Deploy Cloudflare Production
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Preview KV namespace ID
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_PREVIEW_KV_ID: ${{ secrets.CLOUDFLARE_PREVIEW_KV_ID }}
        run: |
          if [[ ! "$CLOUDFLARE_PREVIEW_KV_ID" =~ ^[[:xdigit:]]{32}$ ]]; then
            printf '%s\n' 'CLOUDFLARE_PREVIEW_KV_ID must be a 32-character hexadecimal namespace ID.' >&2
            exit 1
          fi
          sed -i "s/^id = \"00000000000000000000000000000000\"$/id = \"$CLOUDFLARE_PREVIEW_KV_ID\"/" wrangler.toml
      - name: Deploy Cloudflare Preview
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler preview --name staging --ignore-base-config
